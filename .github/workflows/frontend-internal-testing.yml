name: Frontend Internal Testing
# Manual: cuts an EAS "production" Android build (AAB, versionCode
# auto-incremented remotely) and submits it to the Play Store *internal testing*
# track (eas.json submit.internal). Run it from the Actions tab (or
# `gh workflow run frontend-internal-testing.yml`) once enough changes have
# landed on main to be worth a build — it deliberately doesn't run on every
# merge, because EAS's Free plan has a small monthly build quota. It builds
# whatever main is at when you run it (or pick another ref in the dispatch UI).
# The build waits in the runner so a failed build/submit shows up as a red run.
#
# This is only the bake step. Going to production = promote the already-tested
# release from internal testing in Play Console (no rebuild, so what ships is
# exactly what testers ran), or use the manual "Frontend Store Submit"
# workflow, which builds fresh and uploads a draft to the production track.
on:
  workflow_dispatch: {}
# One at a time, in order; never cancel a build that's already in flight.
concurrency:
  group: frontend-internal-testing
  cancel-in-progress: false
jobs:
  eas-internal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build and submit (internal testing)
        run: eas build --platform android --profile production --non-interactive --auto-submit-with-profile=internal
