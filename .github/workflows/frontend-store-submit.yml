name: Frontend Store Submit

# Manual: cuts an EAS "production" build (Android app bundle) and submits it
# to the Play Store production track as a draft (eas.json submit.production.
# android.releaseStatus = "draft") — uploaded but not rolled out, so a human
# still has to promote it in Play Console. Never runs automatically; trigger
# it deliberately when you actually want a store build cut.

on:
  workflow_dispatch: {}

concurrency:
  group: frontend-store-submit

jobs:
  eas-submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit (production, draft)
        run: eas build --platform android --profile production --non-interactive --auto-submit
