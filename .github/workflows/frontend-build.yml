name: Frontend Build

# Kicks off an EAS "preview" build (installable Android APK + iOS simulator
# build, no Apple Developer account needed) on every push to main that
# touches the frontend. Production (signed store builds/submission) is a
# separate, not-yet-automated step.

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch: {}

concurrency:
  group: frontend-build-${{ github.ref }}

jobs:
  eas-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build (preview)
        run: eas build --platform all --profile preview --non-interactive --no-wait
