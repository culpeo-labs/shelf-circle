name: Frontend Build

# Manual: kicks off an EAS "preview" build (installable Android APK + iOS
# simulator build, no Apple Developer account needed). This used to run on every
# push to main, but that was two EAS builds per merge on top of the
# Play-internal-testing build (frontend-internal-testing.yml), and it exhausted
# the Free plan's monthly build quota. Run it from the Actions tab (or
# `gh workflow run frontend-build.yml`) when you want a preview build.

on:
  workflow_dispatch: {}

concurrency:
  group: frontend-build-${{ github.ref }}

jobs:
  eas-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build (preview)
        run: eas build --platform all --profile preview --non-interactive --no-wait
